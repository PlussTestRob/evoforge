# A stricter locomotion experiment than first-walkers.
#
# first-walkers uses omnidirectional distance, which a tumbling body can
# satisfy. This one requires signed progress along +X and pays a bonus for
# keeping the root block upright, so a gait has to beat a fall.

[experiment]
name = "directed-walkers"
seed = 20260905
output_dir = "runs"

[evolution]
population_size = 100
generations = 100
elite_count = 2
tournament_size = 4
crossover_rate = 0.7
immigrant_rate = 0.02

[body]
min_parts = 2
max_parts = 6
min_half_extent = 0.08
max_half_extent = 0.35
density = 250.0
min_joint_limit = 0.3
max_joint_limit = 1.4
max_motor_speed = 6.0
max_motor_torque = 120.0
hinge_probability = 0.85

[brain]
hidden = 10
init_sigma = 0.8
weight_limit = 8.0

[mutation]
weight_rate = 0.08
weight_sigma = 0.25
weight_reset_rate = 0.05
size_rate = 0.05
size_sigma = 0.05
attach_rate = 0.05
attach_sigma = 0.15
joint_limit_rate = 0.05
joint_limit_sigma = 0.2
joint_kind_rate = 0.02
joint_axis_rate = 0.03
motor_rate = 0.05
motor_sigma = 0.15
add_part_rate = 0.06
remove_part_rate = 0.05

[simulation]
duration = 8.0
control_hz = 20.0
solver_iterations = 10
settle_time = 0.5

[environment]
terrain = "flat"
gravity = 9.81
friction = 0.8
restitution = 0.0
linear_damping = 0.02
angular_damping = 0.05

[fitness]
objective = "distance_x"
energy_penalty = 0.0
upright_bonus = 0.15

[recording]
top_n = 3
random_samples = 1
record_hz = 30.0
every_generations = 10
store_genomes = true

[checkpoint]
every_generations = 25
on_finish = true
